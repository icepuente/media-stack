# OPTIONAL override: send ALL Transmission traffic through a VPN (gluetun).
#
# Enable by adding this line to .env:
#   COMPOSE_FILE=docker-compose.yml:compose.vpn.yml
# (or run: docker compose -f docker-compose.yml -f compose.vpn.yml up -d)
#
# How it works: Transmission joins gluetun's network namespace, so it has no
# network at all unless the VPN tunnel is up (built-in kill switch). gluetun
# carries the network alias "transmission", so Radarr/Sonarr/Shelfmark keep
# using http://transmission:9091 whether or not the VPN is enabled.
#
# Provider-specific variables: https://github.com/qdm12/gluetun-wiki
# Requires Docker Compose v2.24+ (for the !reset tag below).

services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      # WireGuard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      # OpenVPN
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      # Port forwarding (only some providers support it, e.g. ProtonVPN)
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      # Optional: let tunnelled containers open connections to hosts on your LAN
      # (not needed for the web UI or for Radarr/Sonarr, which use the Docker network)
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:-}
    volumes:
      - ${CONFIG_ROOT:-./config}/gluetun:/gluetun
    ports:
      - "${BIND_IP:-0.0.0.0}:${TRANSMISSION_PORT:-9091}:9091"
    networks:
      default:
        aliases:
          - transmission
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # gluetun ships its own healthcheck (VPN tunnel up + DNS working)

  transmission:
    network_mode: "service:gluetun"
    ports: !reset []
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
